version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kyptic_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kyptic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kyptic_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kyptic_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kyptic} -d ${POSTGRES_DB:-kyptic_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
